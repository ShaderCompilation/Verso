name: Bug report
description: Report a bug, crash, or unexpected behaviour in Verso
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! If this happened on a Kindle, a redacted problem report from **Settings → Advanced → Create problem report** (or **KUAL → Verso → Create problem report**, saved in `verso/reports/`) helps a lot.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the issue and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: false

  - type: input
    id: device
    attributes:
      label: Kindle model (or desktop simulator)
      placeholder: e.g. Paperwhite 6 (12th gen), Basic 4, or Desktop simulator
    validations:
      required: true

  - type: input
    id: firmware
    attributes:
      label: Firmware version
      placeholder: e.g. 5.17.1 (leave blank for simulator)
    validations:
      required: false

  - type: input
    id: verso_version
    attributes:
      label: Verso version
      placeholder: e.g. 0.1.0-beta.2
    validations:
      required: true

  - type: textarea
    id: report
    attributes:
      label: Problem report or logs
      description: Drag and drop the redacted report from `verso/reports/` here, or paste relevant log lines.
    validations:
      required: false
