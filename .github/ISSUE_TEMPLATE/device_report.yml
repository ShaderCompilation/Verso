name: Device compatibility report
description: Share test results for an untested Kindle model so it can be marked supported
title: "[Device] "
labels: ["device-report"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing Verso on another Kindle! Please run through the checks below and attach a redacted problem report from **Settings → Advanced → Create problem report** (or **KUAL → Verso → Create problem report**, saved in `verso/reports/`).

  - type: input
    id: device
    attributes:
      label: Kindle model
      placeholder: e.g. Paperwhite 5 (11th gen, 2021), Oasis 3, Scribe
    validations:
      required: true

  - type: input
    id: firmware
    attributes:
      label: Firmware version
      placeholder: e.g. 5.16.21
    validations:
      required: true

  - type: input
    id: verso_version
    attributes:
      label: Verso version
      placeholder: e.g. 0.1.0-beta.2
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: What worked?
      options:
        - label: Launches from KUAL and restores Kindle UI cleanly on exit
        - label: Display resolution, orientation, and text clarity look right
        - label: Touch coordinates and page turns feel accurate
        - label: Sleep / wake (power button or cover) works cleanly
        - label: Frontlight brightness (and warmth, if supported) works
        - label: Wi-Fi transfer (`verso.local` or IP) works
        - label: Hardware page-turn buttons work (Oasis only)

  - type: textarea
    id: notes
    attributes:
      label: Notes or issues encountered
      description: Anything off (ghosting, clipped layout, inverted touch, slowness, crashes)?
    validations:
      required: false

  - type: textarea
    id: report
    attributes:
      label: Problem report
      description: Drag and drop the redacted report from `verso/reports/` here.
    validations:
      required: false
