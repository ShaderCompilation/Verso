name: CI

# Docs-only changes skip CI. Not `**/*.md`: NOTICE.md ships in the app
# package and dist/kindle/kpm/ is packaged whole.
on:
  push:
    branches: [master]
    paths-ignore: &docs-only
      - README.md
      - CONTRIBUTING.md
      - SECURITY.md
      - AGENTS.md
      - CLAUDE.md
      - docs/**
      - .github/ISSUE_TEMPLATE/**
  pull_request:
    paths-ignore: *docs-only

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Test, lint & format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup desktop environment
        uses: ./.github/actions/setup-desktop

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

  launcher:
    name: Launcher tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Launcher tests
        run: scripts/test-launcher.sh

  kindle:
    name: Kindle build & ELF guard
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Kindle environment
        uses: ./.github/actions/setup-kindle

      - name: Build & verify Kindle artifacts
        run: |
          cargo kindle-build --locked
          scripts/build-ssh.sh
          scripts/build-wordforms.sh
          cargo build --locked --quiet -p verso-update --bin verso-release
          scripts/stage.sh
