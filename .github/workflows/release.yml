name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v0.1.0-beta.2)'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  preflight:
    name: Preflight checks
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.verify.outputs.version }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check if already published
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "$(gh release view "$TAG" -R "${{ github.repository }}" --json isDraft -q .isDraft 2>/dev/null || true)" = "false" ]; then
            echo "Release $TAG is already published; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 1

      - name: Verify tag matches Cargo.toml and release notes exist
        id: verify
        if: steps.check.outputs.skip != 'true'
        run: |
          VERSION="$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          [ -n "$VERSION" ] || { echo "Could not read workspace version from Cargo.toml" >&2; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG does not match Cargo.toml version $VERSION" >&2
            exit 1
          fi
          NOTES="dist/release-notes/$VERSION.txt"
          if [ ! -s "$NOTES" ]; then
            echo "Missing or empty release notes: $NOTES" >&2
            exit 1
          fi

  validate:
    name: Desktop tests, lint & format
    needs: preflight
    if: needs.preflight.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.tag }}
          fetch-depth: 1

      - name: Setup desktop environment
        uses: ./.github/actions/setup-desktop
        with:
          save-caches: ${{ github.ref_type != 'tag' }}

      - name: Validate
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

  launcher:
    name: Launcher tests
    needs: preflight
    if: needs.preflight.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.tag }}
          fetch-depth: 1

      - name: Launcher tests
        run: scripts/test-launcher.sh

  package:
    name: Build & package Kindle release
    needs: preflight
    if: needs.preflight.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.tag }}
          fetch-depth: 1

      - name: Setup Kindle environment
        uses: ./.github/actions/setup-kindle
        with:
          save-caches: ${{ github.ref_type != 'tag' }}

      - name: Package release
        run: scripts/package.sh

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-package
          path: target/package/${{ needs.preflight.outputs.version }}/*
          retention-days: 1

  draft-release:
    name: Create draft GitHub Release
    needs: [preflight, validate, launcher, package]
    if: needs.preflight.outputs.skip != 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
      VERSION: ${{ needs.preflight.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.tag }}
          fetch-depth: 1

      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          name: release-package
          path: release-out

      - name: Create or update draft GitHub Release
        run: |
          NOTES="dist/release-notes/$VERSION.txt"
          if STATE="$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null)"; then
            if [ "$STATE" != "true" ]; then
              echo "Release $TAG is already published; refusing to overwrite." >&2
              exit 1
            fi
            gh release upload "$TAG" release-out/* --clobber
            gh release edit "$TAG" --title "Verso $VERSION" --notes-file "$NOTES"
          else
            gh release create "$TAG" release-out/* \
              --draft \
              --title "Verso $VERSION" \
              --notes-file "$NOTES"
          fi
