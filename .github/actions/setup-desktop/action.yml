name: Setup desktop Rust & native build environment
description: Installs Rust, checks formatting early, checks out desktop submodules, installs mold, and restores native/Cargo caches.

inputs:
  save-caches:
    description: Whether to save caches on miss (set to 'false' on tag builds)
    required: false
    default: 'true'
  check-fmt:
    description: Run cargo fmt --check right after installing Rust to fail fast
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Check formatting
      if: inputs.check-fmt == 'true'
      shell: bash
      run: cargo fmt --check

    - name: Configure desktop build environment
      shell: bash
      run: |
        {
          echo "VERSO_NATIVE_CACHE=/tmp/verso-native-cache"
          echo "CARGO_PROFILE_DEV_DEBUG=line-tables-only"
          echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold"
        } >> "$GITHUB_ENV"

    - name: Checkout submodules
      shell: bash
      run: |
        git submodule update --init --depth=1 --jobs=8 \
          third_party/crengine third_party/freetype third_party/harfbuzz \
          third_party/hunspell third_party/libjpeg-turbo third_party/libpng \
          third_party/libunibreak third_party/utf8proc third_party/xxhash \
          third_party/zlib

    - name: Install mold linker
      uses: taiki-e/install-action@v2
      with:
        tool: mold

    - name: Compute native cache key
      id: native-key
      shell: bash
      run: |
        KEY="$({
          git submodule status -- \
            third_party/crengine third_party/freetype third_party/harfbuzz \
            third_party/hunspell third_party/libjpeg-turbo third_party/libpng \
            third_party/libunibreak third_party/utf8proc third_party/xxhash \
            third_party/zlib
          cc --version
          c++ --version
        } | sha256sum | cut -d' ' -f1)"
        echo "key=$KEY" >> "$GITHUB_OUTPUT"

    - name: Cache native C/C++ libraries
      if: inputs.save-caches == 'true'
      uses: actions/cache@v6
      with:
        path: ${{ env.VERSO_NATIVE_CACHE }}
        key: native-desktop-${{ runner.os }}-${{ steps.native-key.outputs.key }}-${{ hashFiles('crates/crengine-sys/build.rs', 'crates/crengine-sys/config/**', 'crates/crengine-sys/shim/**', 'crates/crengine-sys/lunasvg/**', 'crates/hunspell-sys/build.rs', 'crates/hunspell-sys/shim/**') }}

    - name: Restore native C/C++ libraries
      if: inputs.save-caches != 'true'
      uses: actions/cache/restore@v6
      with:
        path: ${{ env.VERSO_NATIVE_CACHE }}
        key: native-desktop-${{ runner.os }}-${{ steps.native-key.outputs.key }}-${{ hashFiles('crates/crengine-sys/build.rs', 'crates/crengine-sys/config/**', 'crates/crengine-sys/shim/**', 'crates/crengine-sys/lunasvg/**', 'crates/hunspell-sys/build.rs', 'crates/hunspell-sys/shim/**') }}

    - name: Cache Cargo
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: desktop
        save-if: ${{ inputs.save-caches }}
