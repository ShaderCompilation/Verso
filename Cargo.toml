[workspace]
resolver = "3"
members = ["crates/verso", "crates/verso-mdns", "crates/verso-update", "crates/verso-wordforms", "crates/fbink-sys", "crates/crengine-sys", "crates/hunspell-sys"]

[workspace.package]
version = "0.1.0-beta.13"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ShaderCompilation/Verso"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Optimize cold dependencies for size while keeping rendering, image, and text
# hot paths at -O3.
[profile.release.package."*"]
opt-level = "z"

[profile.release.package.crengine-sys]
opt-level = 3
[profile.release.package.tiny-skia]
opt-level = 3
[profile.release.package.image]
opt-level = 3
[profile.release.package.zune-jpeg]
opt-level = 3
[profile.release.package.png]
opt-level = 3
[profile.release.package.flate2]
opt-level = 3
[profile.release.package.fdeflate]
opt-level = 3
[profile.release.package.miniz_oxide]
opt-level = 3
[profile.release.package.simd-adler32]
opt-level = 3
[profile.release.package.crc32fast]
opt-level = 3
[profile.release.package.cosmic-text]
opt-level = 3
[profile.release.package.swash]
opt-level = 3
[profile.release.package.zeno]
opt-level = 3
[profile.release.package.harfrust]
opt-level = 3
[profile.release.package.skrifa]
opt-level = 3
[profile.release.package.read-fonts]
opt-level = 3

# Keep image/text math fast even in debug builds of the simulator.
[profile.dev.package."*"]
opt-level = 2
