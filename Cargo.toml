[workspace]
resolver = "3"
members = ["crates/verso", "crates/fbink-sys"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Keep image/text math fast even in debug builds of the simulator.
[profile.dev.package."*"]
opt-level = 2
