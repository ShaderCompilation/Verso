<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:,">
<title>Verso</title>
<style>
:root {
  --ink: #1d1d1b; --ink2: #6b6964; --line: #dcd9d2; --paper: #fbfaf7; --wash: #f1efe9; --accent: #1d1d1b;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
[hidden] { display: none !important; }
header {
  display: flex; flex-wrap: wrap; gap: .25rem 1rem; align-items: baseline; justify-content: space-between;
  padding: 1rem 1.25rem .75rem; border-bottom: 1px solid var(--line);
}
header h1 { margin: 0; font: 600 1.15rem/1.2 Georgia, "Times New Roman", serif; }
header h1 span { color: var(--ink2); font-weight: 400; }
#facts { color: var(--ink2); font-size: .9rem; }
nav { display: flex; gap: .25rem; padding: 0 1rem; border-bottom: 1px solid var(--line); overflow-x: auto; }
nav button {
  font: inherit; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--ink2);
  padding: .75rem .75rem .6rem; cursor: pointer; white-space: nowrap;
}
nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
main { max-width: 52rem; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }
.empty { color: var(--ink2); padding: 2.5rem 1rem; text-align: center; border: 1px dashed var(--line); border-radius: .5rem; }
.card {
  max-width: 24rem; margin: 12vh auto 0; padding: 1.75rem 1.5rem; background: #fff;
  border: 1px solid var(--line); border-radius: .75rem;
}
.card h2 { margin: 0 0 .5rem; font: 600 1.25rem/1.3 Georgia, "Times New Roman", serif; }
.card p { margin: 0 0 1rem; color: var(--ink2); }
form { display: flex; gap: .5rem; }
input {
  flex: 1; min-width: 0; font: 600 1.5rem/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .4em;
  padding: .55rem .75rem; border: 1px solid var(--ink2); border-radius: .4rem; background: #fff; color: var(--ink);
}
button.primary {
  font: 600 1rem/1 system-ui, sans-serif; padding: 0 1.1rem; border-radius: .4rem; border: 1px solid var(--accent);
  background: var(--accent); color: #fff; cursor: pointer;
}
button.primary:disabled { opacity: .5; cursor: default; }
.error { color: #8a1c1c; min-height: 1.45em; margin: .75rem 0 0; }
</style>
</head>
<body>
<section id="signin" class="card" hidden>
  <h2>Verso</h2>
  <p>Enter the code shown on your Kindle.</p>
  <form id="form">
    <input id="code" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="one-time-code"
           aria-label="Code" required>
    <button class="primary" id="go">Connect</button>
  </form>
  <p class="error" id="error" role="alert"></p>
</section>

<section id="gone" class="card" hidden>
  <h2>Wi-Fi transfer has stopped</h2>
  <p>Open Wi-Fi transfer on the Kindle again, then reload this page.</p>
</section>

<div id="app" hidden>
  <header>
    <h1>Verso <span id="name"></span></h1>
    <div id="facts"></div>
  </header>
  <nav role="tablist">
    <button role="tab" id="tab-books" aria-controls="books">Books</button>
    <button role="tab" id="tab-dictionaries" aria-controls="dictionaries">Dictionaries</button>
    <button role="tab" id="tab-files" aria-controls="files">Files</button>
  </nav>
  <main>
    <section role="tabpanel" id="books" aria-labelledby="tab-books">
      <p class="empty">Sending and managing books comes next.</p>
    </section>
    <section role="tabpanel" id="dictionaries" aria-labelledby="tab-dictionaries" hidden>
      <p class="empty">Installing dictionaries comes next.</p>
    </section>
    <section role="tabpanel" id="files" aria-labelledby="tab-files" hidden>
      <p class="empty">Browsing the Kindle's files comes next.</p>
    </section>
  </main>
</div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const views = ["signin", "gone", "app"];
function show(view) {
  for (const v of views) $(v).hidden = v !== view;
}

// Every call carries X-Verso-Request: another site's page can't send it.
async function call(path, options = {}) {
  const headers = Object.assign({ "X-Verso-Request": "1" }, options.headers || {});
  try {
    return await fetch(path, Object.assign({ credentials: "same-origin", cache: "no-store" }, options, { headers }));
  } catch (e) {
    show("gone");
    throw e;
  }
}

function size(bytes) {
  if (bytes >= 1e9) return (bytes / 1e9).toFixed(1) + " GB";
  if (bytes >= 1e6) return Math.round(bytes / 1e6) + " MB";
  return Math.max(1, Math.round(bytes / 1e3)) + " KB";
}

async function loadStatus() {
  const response = await call("/api/status");
  if (response.status === 401) {
    show("signin");
    $("code").focus();
    return;
  }
  if (!response.ok) return;
  const status = await response.json();
  $("name").textContent = status.name ? "· " + status.name : "";
  const facts = [];
  if (typeof status.free === "number") facts.push(size(status.free) + " free");
  if (status.battery) facts.push(status.battery.percent + "% battery" + (status.battery.charging ? ", charging" : ""));
  $("facts").textContent = facts.join(" · ");
  show("app");
}

const messages = {
  wrong: "That code didn't work. Check the code on the Kindle.",
  "new-code": "Too many tries. The Kindle now shows a new code.",
  busy: "Wait a moment, then try again.",
};

async function signIn(code, retries = 2) {
  $("error").textContent = "";
  $("go").disabled = true;
  try {
    const response = await call("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code }),
    });
    if (response.ok) {
      $("code").value = "";
      await loadStatus();
      return;
    }
    if (response.status === 429 && retries > 0) {
      const wait = 1000 * (Number(response.headers.get("Retry-After")) || 1);
      await new Promise((resolve) => setTimeout(resolve, wait));
      return signIn(code, retries - 1);
    }
    let reason = "busy";
    if (response.status === 401) reason = (await response.json()).error;
    show("signin");
    $("error").textContent = messages[reason] || messages.wrong;
    $("code").select();
  } finally {
    $("go").disabled = false;
  }
}

$("form").addEventListener("submit", (event) => {
  event.preventDefault();
  signIn($("code").value.trim());
});

for (const tab of document.querySelectorAll("[role=tab]")) {
  tab.addEventListener("click", () => select(tab.id.slice(4)));
}
function select(name) {
  for (const tab of document.querySelectorAll("[role=tab]")) {
    const on = tab.id === "tab-" + name;
    tab.setAttribute("aria-selected", on);
    $(tab.getAttribute("aria-controls")).hidden = !on;
  }
}
select("books");

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && !$("app").hidden) loadStatus().catch(() => {});
});

// The QR code carries the code in the fragment, which browsers never send.
const fragment = new URLSearchParams(location.hash.slice(1));
const given = fragment.get("code");
if (given) {
  history.replaceState(null, "", location.pathname + location.search);
  signIn(given).catch(() => {});
} else {
  loadStatus().catch(() => {});
}
</script>
</body>
</html>
