[package]
name = "verso"
description = "A calm, lightweight e-reader for jailbroken Kindles."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
crengine-sys = { path = "../crengine-sys" }
cosmic-text = { version = "0.19.0", default-features = false, features = ["std", "swash"] }
env_logger = { version = "0.11.11", default-features = false, features = ["auto-color", "humantime"] }
fbink-sys = { path = "../fbink-sys", optional = true }
libc = "0.2.191"
log = "0.4.35"
resvg = { version = "0.49.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
softbuffer = { version = "0.4.8", optional = true }
tiny-skia = "0.12.0"
winit = { version = "0.30.13", optional = true }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
sha2 = "0.10"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
unicode-segmentation = "1.13.3"
unicode-normalization = "0.1"
caseless = "0.2.2"

[features]
default = ["desktop"]
# Desktop simulator: runs natively in a window.
desktop = ["dep:winit", "dep:softbuffer"]
# Kindle backend: FBInk display + raw evdev input.
kindle = ["dep:fbink-sys"]
