[package]
name = "verso"
description = "A calm, lightweight e-reader for jailbroken Kindles."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
crengine-sys = { path = "../crengine-sys" }
# Base forms from user-installed Hunspell dictionaries.
hunspell-sys = { path = "../hunspell-sys" }
cosmic-text = { version = "0.19.0", default-features = false, features = ["std", "swash"] }
env_logger = { version = "0.11.11", default-features = false, features = ["auto-color", "humantime"] }
fbink-sys = { path = "../fbink-sys", optional = true }
verso-mdns = { path = "../verso-mdns" }
verso-wordforms = { path = "../verso-wordforms", default-features = false }
libc = "0.2.191"
log = "0.4.35"
resvg = { version = "0.49.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
softbuffer = { version = "0.4.8", optional = true }
tiny-skia = "0.12.0"
winit = { version = "0.30.13", optional = true }
zip = { version = "2.4.2", default-features = false, features = ["deflate-flate2", "flate2"] }
tar = { version = "0.4.46", default-features = false }
# Decode-only bzip2 for .tar.bz2 dictionaries.
bzip2-rs = "0.1.2"
quick-xml = { version = "0.41", features = ["escape-html"] }
flate2 = "1.1"
qrcode = { version = "0.14", default-features = false }
sha2 = "0.10"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
unicode-segmentation = "1.13.3"
# Book language detection from its text.
whatlang = "0.18.0"
unicode-normalization = "0.1"
caseless = "0.2.2"
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }
verso-update = { path = "../verso-update", default-features = false }

[features]
default = ["desktop"]
# Desktop simulator: runs natively in a window.
desktop = ["dep:winit", "dep:softbuffer"]
# Kindle backend: FBInk display + raw evdev input.
kindle = ["dep:fbink-sys"]

[dev-dependencies]
tempfile = "3"
# Tests write small word-form packs with the builder.
verso-wordforms = { path = "../verso-wordforms", features = ["build"] }
# Tests pack releases to download and stage.
verso-update = { path = "../verso-update", features = ["release"] }
# Tests compress .tar.bz2 dictionary archives; the app only decodes them.
bzip2 = "0.6.1"
